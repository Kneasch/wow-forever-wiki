# WoW Forever Wiki - static HTML assembled server-side with nginx SSI.
# Mounted at /etc/nginx/conf.d/default.conf (see docker-compose.yml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Server-side includes stitch the shared header/sidebar/footer into each page.
    ssi on;
    ssi_silent_errors off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Article pages: /w/Hammer_of_Divine_Might -> site/w/Hammer_of_Divine_Might.html
    location /w/ {
        try_files $uri $uri.html =404;
    }

    # Shared fragments are only reachable through SSI subrequests.
    location /_includes/ {
        internal;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
