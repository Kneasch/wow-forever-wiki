# Make sure the repo checks out and the wiki builds on every OS contributors use.
# Pages are not committed: the build renders them, so a page name Windows cannot create
# (e.g. "Pattern:_Ghostweave_Pants.html") fails the Windows build step.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Portable file names, no case-only collisions; every page renders with no broken /w/ links or assets
      - run: npm run check

      # Render every page into dist/, so the pages are written as real files on this OS
      - run: npm run build
